<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Edit | DecoMuse</title>
  <meta name="description" content="A DecoMuse styling journal article — tips for living beautifully.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="DecoMuse">
  <meta property="og:image" content="https://www.decomuse.com.au/assets/hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.decomuse.com.au/assets/hero.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .article { max-width: 760px; margin: 0 auto; }
    .article-cover { aspect-ratio: 16/8; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 34px; }
    .article-meta { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); font-weight: 500; margin-bottom: 10px; }
    .article h1 { font-size: clamp(2rem,4vw,3rem); line-height: 1.15; margin: 0 0 26px; }
    .article-content p { font-size: 1.05rem; line-height: 1.85; color: var(--body); margin: 0 0 20px; }
    .article-content h2 { font-size: 1.5rem; margin: 34px 0 12px; }
    .article-content h3 { font-size: 1.2rem; margin: 28px 0 10px; color: var(--rose-deep); }
    .article-content a { color: var(--rose-deep); text-decoration: underline; text-underline-offset: 3px; }
    .article-share { display: flex; gap: 12px; align-items: center; margin: 40px 0; padding-top: 24px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .share-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 30px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 0.85rem; color: var(--ink); text-decoration: none; }
    .share-btn:hover { background: var(--rose); color: #fff; border-color: var(--rose); }
    .more-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
    @media (max-width: 760px){ .more-grid { grid-template-columns: 1fr; } }
    .mini-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; color: inherit; display: block; }
    .mini-card .ph { aspect-ratio: 3/2; }
    .mini-card .mc-body { padding: 16px 18px; }
    .mini-card h4 { margin: 0 0 6px; font-size: 1rem; }
    .mini-card .post-meta { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rose-deep); }
  </style>
</head>
<body data-page="blog.html">
  <div id="site-header"></div>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="breadcrumb" id="crumb"><a href="index.html">Home</a> / <a href="blog.html">The Edit</a></div>
      <article class="article" id="articleWrap"></article>
    </div>
  </section>

  <section class="section bg-cream2" id="moreSection" style="display:none">
    <div class="container">
      <h2 style="margin-bottom:22px">More from The Edit</h2>
      <div class="more-grid" id="moreGrid"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/blog.js"></script>
  <script>
    function fmtDate(s){ return new Date(s + "T00:00:00").toLocaleDateString("en-AU",{ day:"numeric", month:"long", year:"numeric" }); }
    function postCover(p, cls){ return `<div class="ph ${p.ph||''} ${cls||''}" data-label="${p.title}"><img class="ph-img" src="${p.cover}" alt="${p.title}" loading="lazy" onerror="this.remove()"></div>`; }

    (function(){
      const slug = new URLSearchParams(location.search).get("post");
      const p = POSTS.find(x => x.slug === slug) || POSTS[0];
      const url = "https://www.decomuse.com.au/article.html?post=" + p.slug;

      // Update meta + title for SEO / sharing
      document.title = p.title + " | The Edit — DecoMuse";
      const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute("content", val); };
      setMeta('meta[name="description"]', p.excerpt);
      setMeta('meta[property="og:title"]', p.title);
      setMeta('meta[property="og:description"]', p.excerpt);
      setMeta('meta[property="og:image"]', "https://www.decomuse.com.au/" + p.cover);
      setMeta('meta[name="twitter:image"]', "https://www.decomuse.com.au/" + p.cover);
      let ogUrl = document.querySelector('meta[property="og:url"]');
      if (!ogUrl){ ogUrl = document.createElement("meta"); ogUrl.setAttribute("property","og:url"); document.head.appendChild(ogUrl); }
      ogUrl.setAttribute("content", url);

      // JSON-LD Article schema for Google
      const ld = { "@context":"https://schema.org", "@type":"Article", "headline":p.title,
        "description":p.excerpt, "datePublished":p.date, "image":"https://www.decomuse.com.au/"+p.cover,
        "author":{"@type":"Organization","name":"DecoMuse"},
        "publisher":{"@type":"Organization","name":"DecoMuse","logo":{"@type":"ImageObject","url":"https://www.decomuse.com.au/assets/logo.jpg"}},
        "mainEntityOfPage":url };
      const s = document.createElement("script"); s.type = "application/ld+json";
      s.textContent = JSON.stringify(ld); document.head.appendChild(s);

      document.getElementById("articleWrap").innerHTML = `
        <div class="article-meta">${p.cat} · ${p.read} min read · ${fmtDate(p.date)}</div>
        <h1>${p.title}</h1>
        <div class="article-cover">${postCover(p)}</div>
        <div class="article-content">${p.body}</div>
        <div class="article-share">
          <strong style="font-size:.85rem">Share:</strong>
          <a class="share-btn" target="_blank" rel="noopener" href="https://www.pinterest.com/pin/create/button/?url=${encodeURIComponent(url)}&media=${encodeURIComponent("https://www.decomuse.com.au/"+p.cover)}&description=${encodeURIComponent(p.title)}">📌 Pinterest</a>
          <a class="share-btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
          <a class="share-btn" href="#" onclick="navigator.clipboard&&navigator.clipboard.writeText('${url}');this.textContent='✓ Link copied';return false;">🔗 Copy link</a>
        </div>`;

      // More articles
      const more = POSTS.filter(x => x.slug !== p.slug).slice(0, 3);
      if (more.length){
        document.getElementById("moreSection").style.display = "";
        document.getElementById("moreGrid").innerHTML = more.map(m => `
          <a class="mini-card" href="article.html?post=${m.slug}">
            ${postCover(m)}
            <div class="mc-body"><div class="post-meta">${m.cat}</div><h4>${m.title}</h4></div>
          </a>`).join("");
      }
    })();
  </script>
</body>
</html>

# ============================================================
#  Samira Home Decor — Netlify configuration
#  Static site + serverless Stripe checkout.
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"
  # On every deploy, regenerate from js/data.js (the single source of truth):
  #  • the trusted server-side price catalogue (checkout can't drift from shop)
  #  • the sitemap (so new products get crawled)
  #  • the Google Shopping feed (so new products reach Merchant Center)
  command = "node scripts/gen-catalogue.js && node scripts/gen-sitemap.js && node scripts/gen-feed.js"

[functions]
  node_bundler = "esbuild"

# Consolidate the alternate .com domain onto the primary .com.au, so there is
# one canonical site for SEO (the bare samirahomedecor.com otherwise serves a
# duplicate). www variants already 301 automatically; this covers the apex.
[[redirects]]
  from = "https://samirahomedecor.com/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://samirahomedecor.com/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

# Old brand: permanently redirect the retired decomuse.com.au to the new site,
# so Google drops the old DecoMuse pages and stops attributing them to Samira.
[[redirects]]
  from = "https://decomuse.com.au/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://decomuse.com.au/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.decomuse.com.au/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.decomuse.com.au/*"
  to = "https://samirahomedecor.com.au/:splat"
  status = 301
  force = true

# Friendly alias: POST /api/create-checkout-session
# -> /.netlify/functions/create-checkout-session
[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/issue-gift-card"
  to = "/.netlify/functions/issue-gift-card"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

# Sensible security headers for a retail site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Weekly subscriber email (scheduled function) — Wed 22:30 UTC ≈ Thu ~9am Adelaide
[functions."weekly-email"]
  schedule = "30 22 * * 3"

# "Come back" reminder to subscribers who browsed 1–3 days ago — daily 23:30 UTC ≈ 10am Adelaide
[functions."visit-reminder"]
  schedule = "30 23 * * *"

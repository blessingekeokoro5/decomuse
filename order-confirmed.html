<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed, DecoMuse</title>
  <meta name="description" content="Thank you for your DecoMuse order.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="order-confirmed.html">
  <div id="site-header"></div>

  <section class="section">
    <div class="container" style="max-width:640px">
      <div class="form-card text-center reveal" id="confirmCard">
        <div style="font-size:3.4rem">🎉</div>
        <span class="eyebrow">Thank you</span>
        <h1 style="font-size:2.4rem">Order confirmed</h1>
        <p class="lead" id="confirmMsg">Your order has been placed, a confirmation is on its way to your inbox.</p>
        <div class="btn-row" style="justify-content:center;margin-top:24px">
          <a class="btn btn--primary" href="track.html">Track my order</a>
          <a class="btn btn--outline" href="shop.html">Continue shopping</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      try {
        const o = JSON.parse(localStorage.getItem("dm_last_order"));
        if (o) document.getElementById("confirmMsg").innerHTML =
          `Your order <strong>${o.orderNo}</strong> for <strong>${money(o.total)}</strong> has been placed, a confirmation is on its way to ${o.email || "your inbox"}.`;
      } catch (e) {}
      updateCartCount();
    })();
  </script>
</body>
</html>

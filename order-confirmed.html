<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed, DecoMuse</title>
  <meta name="description" content="Thank you for your DecoMuse order.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="order-confirmed.html">
  <div id="site-header"></div>

  <section class="section">
    <div class="container" style="max-width:640px">
      <div class="form-card text-center reveal" id="confirmCard">
        <div style="font-size:3.4rem">🎉</div>
        <span class="eyebrow">Thank you</span>
        <h1 style="font-size:2.4rem">Order confirmed</h1>
        <p class="lead" id="confirmMsg">Your order has been placed, a confirmation is on its way to your inbox.</p>
        <div class="btn-row" style="justify-content:center;margin-top:24px">
          <a class="btn btn--primary" href="track.html">Track my order</a>
          <a class="btn btn--outline" href="shop.html">Continue shopping</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      try {
        const o = JSON.parse(localStorage.getItem("dm_last_order"));
        if (o) document.getElementById("confirmMsg").innerHTML =
          `Your order <strong>${o.orderNo}</strong> for <strong>${money(o.total)}</strong> has been placed, a confirmation is on its way to ${o.email || "your inbox"}.`;
      } catch (e) {}
      updateCartCount();
    })();

    // Save this order to the member's portal (receipts) — keyed by email + on the account
    (function saveOrderReceipt() {
      try {
        const o = JSON.parse(localStorage.getItem("dm_last_order") || "null");
        if (!o || !o.orderNo) return;
        const pend = JSON.parse(localStorage.getItem("dm_pending_purchase") || "null");
        let items = (pend && pend.items) ? pend.items.map(it => ({
          id: it.item_id || it.id, name: it.item_name || it.name, cat: it.item_category || it.cat,
          price: it.price != null ? it.price : 0, qty: it.quantity || it.qty || 1, giftCard: it.giftCard
        })) : [];
        if (!items.length) { try { items = getCart().map(i => ({ id: i.id, name: i.name, cat: i.cat, price: i.price, qty: i.qty, giftCard: i.giftCard })); } catch (e) {} }
        const record = {
          orderNo: o.orderNo, date: (new Date()).toISOString().slice(0, 10),
          placedAt: Date.now(),
          total: o.total, shipping: (pend && pend.shipping) || 0, items
        };
        const email = o.email || (typeof getAccount === "function" && getAccount() && getAccount().email);
        // Store keyed by email (survives even before the dashboard loads)
        if (email) {
          const all = JSON.parse(localStorage.getItem("dm_orders") || "{}");
          all[email] = all[email] || [];
          if (!all[email].some(x => x.orderNo === record.orderNo)) all[email].unshift(record);
          localStorage.setItem("dm_orders", JSON.stringify(all));
        }
        // Attach to the logged-in account + award rewards points + consume any applied voucher
        const acc = (typeof getAccount === "function") ? getAccount() : null;
        if (acc && acc.email) {
          acc.orders = acc.orders || [];
          if (!acc.orders.some(x => x.orderNo === record.orderNo)) {
            // Rewards points: $1 = 1 point, 2× on gift purchases (Gifts / hampers / gift cards)
            let earned = 0;
            items.forEach(it => {
              const line = (it.price || 0) * (it.qty || 1);
              const isGift = it.giftCard || /gift|hamper/i.test((it.name || "") + " " + (it.cat || ""));
              earned += Math.round(line) * (isGift ? 2 : 1);
            });
            if (!earned && record.total) earned = Math.round(record.total);
            acc.points = (acc.points || 0) + earned;
            record.pointsEarned = earned;
            // Consume the voucher that was applied to this order
            const av = (typeof getVoucher === "function") ? getVoucher() : null;
            if (av && av.code) acc.vouchers = (acc.vouchers || []).map(v => v.code === av.code ? Object.assign({}, v, { used: true }) : v);
            acc.orders.unshift(record);
            saveAccount(acc);
            if (typeof setVoucher === "function") setVoucher(null);
          }
        }
      } catch (e) {}
    })();

    // GA4: purchase (fires once, then clears so a page refresh won't double-count)
    (function () {
      try {
        const pend = JSON.parse(localStorage.getItem("dm_pending_purchase") || "null");
        if (!pend) return;
        const o = JSON.parse(localStorage.getItem("dm_last_order") || "null");
        const sid = new URLSearchParams(location.search).get("session_id");
        const txn = (o && o.orderNo) || sid || ("DM-" + Date.now());
        if (typeof window.gtag === "function") {
          window.gtag("event", "purchase", {
            transaction_id: txn, currency: "AUD",
            value: (o && o.total != null) ? o.total : pend.value,
            shipping: pend.shipping || 0, items: pend.items || []
          });
        }
        localStorage.removeItem("dm_pending_purchase");
      } catch (e) {}
    })();

    /* Email any purchased gift cards to their recipients (once, after payment). */
    (async function sendGiftCards() {
      let cart = [];
      try { cart = getCart(); } catch (e) { return; }
      const cards = cart.filter(i => i.giftCard && i.giftCard.code && i.giftCard.email);
      if (!cards.length) return;

      let sent = [];
      try { sent = JSON.parse(localStorage.getItem("dm_giftcards_sent") || "[]"); } catch (e) {}
      const endpoint = ((typeof DECOMUSE !== "undefined" && DECOMUSE.giftCardEndpoint) || "/.netlify/functions/send-gift-card");

      for (const item of cards) {
        const gc = item.giftCard;
        if (sent.indexOf(gc.code) !== -1) continue;          // already emailed
        try {
          const res = await fetch(endpoint, {
            method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify(gc)
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) { sent.push(gc.code); }
        } catch (e) { /* leave unsent; will retry if page reloads */ }
      }
      localStorage.setItem("dm_giftcards_sent", JSON.stringify(sent));

      // Gift cards are delivered — clear the cart now that the order is complete.
      if (sent.length) { try { localStorage.removeItem(CART_KEY); updateCartCount(); } catch (e) {} }
    })();
  </script>
</body>
</html>

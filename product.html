<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product, DecoMuse</title>
  <meta name="description" content="Shop this DecoMuse piece, curated home décor & lifestyle.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DecoMuse">
  <meta property="og:image" content="https://www.decomuse.com.au/assets/hero.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://www.decomuse.com.au/assets/hero.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css?v=13">
  <style>
    .pdp { display: grid; grid-template-columns: 1fr 1fr; gap: 46px; align-items: start; }
    .pdp-gallery .main { position: relative; aspect-ratio: 1/1; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .pdp-verified { position: absolute; bottom: 14px; left: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 7px; border-radius: 999px; background: rgba(255,255,255,0.96); border: 1px solid rgba(45,74,58,0.18); box-shadow: var(--shadow-sm); font-family: var(--font-body); font-weight: 700; font-size: 0.68rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--forest); line-height: 1; }
    .pdp-verified svg { width: 18px; height: 18px; color: var(--forest); flex: none; }
    /* Furniture viewer tools — row of icons BELOW the product image */
    .pdp-tools { display: flex; gap: 14px; justify-content: center; margin: 14px 0 2px; }
    .pdp-tool { width: 46px; height: 46px; border-radius: 50%; background: #808a80; border: none;
      cursor: pointer; display: grid; place-items: center; color: #fff; transition: all var(--tr); box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .pdp-tool:hover { background: var(--forest); transform: translateY(-2px); }
    .pdp-tool svg { width: 22px; height: 22px; }
    .pdp-tool-label { display: block; text-align: center; font-size: 0.62rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
    .pdp-tool-wrap { display: flex; flex-direction: column; align-items: center; }
    /* Shared tool overlay */
    .tool-overlay { position: fixed; inset: 0; z-index: 3000; background: rgba(20,24,18,0.82); display: none;
      align-items: center; justify-content: center; padding: 20px; }
    .tool-overlay.open { display: flex; }
    .tool-panel { background: #fff; border-radius: 18px; max-width: 640px; width: 100%; max-height: 92vh; overflow: auto; position: relative; padding: 26px; }
    .tool-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--cream-2); font-size: 1.1rem; cursor: pointer; color: var(--ink); }
    .tool-panel h3 { font-size: 1.35rem; margin: 0 0 4px; }
    .tool-panel .th-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
    /* 360 spin */
    .spin-stage { position: relative; aspect-ratio: 1/1; background: #fff; border-radius: 12px; overflow: hidden; cursor: grab;
      user-select: none; touch-action: pan-y; border: 1px solid var(--line); }
    .spin-stage.dragging { cursor: grabbing; }
    .spin-stage img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
    .spin-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #fff;
      font-size: 0.78rem; padding: 6px 14px; border-radius: 999px; display: inline-flex; gap: 7px; align-items: center; pointer-events: none; }
    .spin-controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
    .spin-controls button { border: 1px solid var(--line); background: var(--cream-2); border-radius: 999px; padding: 8px 16px;
      font-family: var(--font-body); font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .spin-controls button:hover { background: #fff; border-color: var(--forest); }
    /* Dimensions diagram — real product photo with measurement guides */
    .dim-box { display: grid; place-items: center; padding: 6px 0 2px; }
    .dim-photo { position: relative; width: 100%; max-width: 420px; padding: 8px 8px 42px 44px; }
    .dim-frame { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
    .dim-frame img { width: 100%; display: block; object-fit: contain; -webkit-user-drag: none; }
    .dim-mark { position: absolute; color: var(--ink); font: 600 14px var(--font-body); }
    .dim-v { left: 0; top: 8px; bottom: 42px; width: 40px; display: flex; align-items: center; justify-content: center; }
    .dim-v::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; border-left: 1.6px solid var(--forest); }
    .dim-v::after { content: ""; position: absolute; left: 13px; right: 13px; top: 0; height: 0; border-top: 1.6px solid var(--forest); box-shadow: 0 100% 0 -0.4px var(--forest); }
    .dim-v span { position: relative; transform: rotate(-90deg); background: #fff; padding: 3px 4px; white-space: nowrap; }
    .dim-h { left: 44px; right: 8px; bottom: 0; height: 40px; display: flex; align-items: center; justify-content: center; }
    .dim-h::before { content: ""; position: absolute; left: 0; right: 0; top: 19px; border-top: 1.6px solid var(--forest); }
    .dim-h::after { content: ""; position: absolute; left: 0; top: 13px; bottom: 13px; width: 0; border-left: 1.6px solid var(--forest); box-shadow: 100% 0 0 -0.4px var(--forest); }
    .dim-h span { position: relative; background: #fff; padding: 2px 6px; }
    .dim-depth { display: inline-flex; align-items: center; gap: 7px; margin: 12px auto 0; color: var(--forest); font-size: 0.85rem; font-weight: 600; }
    .dim-plain { max-width: 460px; margin: 0 auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
    .dim-plain img { width: 100%; display: block; }
    .dim-list { list-style: none; padding: 0; margin: 18px auto 0; max-width: 360px; }
    .dim-list li { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px dashed var(--line); font-size: 0.95rem; }
    .dim-list li span:first-child { color: var(--muted); }
    .dim-list li strong { font-family: var(--font-head); font-size: 1.05rem; }
    .dim-note { color: var(--muted); font-size: 0.82rem; margin-top: 14px; text-align: center; }
    /* See-in-room / AR */
    .ar-body { text-align: center; }
    .ar-phone { font-size: 2.6rem; }
    .ar-qr { width: 190px; height: 190px; margin: 16px auto; display: block; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: #fff; }
    .ar-steps { text-align: left; max-width: 380px; margin: 8px auto 0; color: var(--body); font-size: 0.9rem; line-height: 1.7; }
    .ar-fine { color: var(--muted); font-size: 0.78rem; margin-top: 16px; }
    model-viewer { width: 100%; height: 340px; background: var(--cream-2); border-radius: 12px; }
    .pdp-thumbs { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: 10px; }
    .pdp-thumbs .ph { aspect-ratio: 1/1; border-radius: 8px; cursor: pointer; }
    /* Show full image (incl. infographic text) instead of cropping */
    #pdpMainImg { object-fit: contain !important; background: #fff; }
    .pdp-thumb img { object-fit: contain !important; background: #fff; }
    .pdp .cat { color: var(--rose-deep); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .pdp h1 { font-size: clamp(2rem,4vw,2.8rem); margin: 8px 0 12px; }
    .pdp .price { font-size: 1.9rem; }
    .pdp-detail-list { list-style: none; padding: 0; margin: 22px 0; }
    .pdp-detail-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 0.92rem; }
    .pdp-detail-list li span:first-child { color: var(--muted); }
    .pdp-buy { display: flex; gap: 12px; align-items: center; margin: 24px 0 12px; flex-wrap: wrap; }
    .member-save { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: #fff; }
    .member-save .ms-head { font-weight: 600; font-size: 1.02rem; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--ink); }
    .ms-badge { background: var(--ink); color: #fff; font-size: 0.68rem; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 999px; }
    .ms-list { list-style: none; margin: 0 0 14px; padding: 0; }
    .ms-list li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 0.9rem; color: var(--body); line-height: 1.45; }
    .ms-list .ms-ic { color: var(--rose-deep); flex: 0 0 auto; }
    .ms-list strong { color: var(--ink); }
    .pdp-share { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 18px; }
    .pdp-share button { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 10px;
      border: 1.5px solid var(--line); background: var(--cream-2); color: var(--ink); font-family: var(--font-body);
      font-size: 0.86rem; font-weight: 500; cursor: pointer; transition: all var(--tr); }
    .pdp-share button:hover { background: #fff; border-color: var(--rose); }
    .pdp-share .wa { background: #25D366; border-color: #25D366; color: #fff; }
    .pdp-share .wa:hover { background: #1eb457; border-color: #1eb457; }
    .pdp-social { display: flex; align-items: center; gap: 8px; margin: 2px 0 12px; font-size: 0.86rem; color: var(--body); background: var(--cream-2); border-radius: 8px; padding: 9px 13px; }
    .pdp-social b { color: var(--rose-deep); font-weight: 700; }
    .pdp-trust { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 18px; font-size: 0.85rem; color: var(--body); }
    .pdp-trust span { display: flex; align-items: center; gap: 7px; }
    @media (max-width: 860px){ .pdp { grid-template-columns: 1fr; gap: 28px; } }
    .pdp-brand { color: var(--rose-deep); font-weight: 500; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .pdp .main { position: relative; }
    .pdp-save { position: absolute; top: 14px; left: 14px; z-index: 3; background: var(--rose); color: #fff; font-family: var(--font-body); font-weight: 600; font-size: 0.85rem; line-height: 1; padding: 12px 12px; border-radius: 14px; box-shadow: var(--shadow-sm); }
    /* You may also like carousel */
    .rel-carousel { position: relative; }
    .rel-track { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; padding: 4px 2px 10px; scrollbar-width: none; }
    .rel-track::-webkit-scrollbar { display: none; }
    .rel-track .card { flex: 0 0 240px; }
    .rel-arrow { position: absolute; top: 40%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 1.4rem; color: var(--ink); z-index: 2; display: grid; place-items: center; }
    .rel-arrow:hover { background: var(--rose); color: #fff; border-color: var(--rose); }
    .rel-arrow.prev { left: -14px; } .rel-arrow.next { right: -14px; }
    @media (max-width: 720px){ .rel-arrow { display: none; } .rel-track .card { flex: 0 0 200px; } }
    /* Review this product */
    .pdp-review-form { max-width: 820px; margin: 0 auto; padding-top: 6px; }
    .pdp-review-form h3 { font-size: 1.15rem; margin-bottom: 12px; }
    .prf-stars { display: flex; gap: 8px; }
    .prf-star { width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 1.4rem; line-height: 1; color: var(--gold); cursor: pointer; transition: all var(--tr); }
    .prf-star:hover, .prf-star.on { background: var(--cream-2); border-color: var(--gold); }
    .prf-note { color: var(--rose-deep); font-size: 0.94rem; margin-top: 12px; }
    .prf-form { margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  </style>
</head>
<body data-page="product.html">
  <div id="site-header"></div>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="breadcrumb" id="pdpCrumb"><a href="index.html">Home</a> / <a href="shop.html">Shop</a></div>
      <div id="pdpWrap"></div>
    </div>
  </section>

  <section class="section bg-cream2" id="relatedSection" style="display:none">
    <div class="container">
      <h2 style="margin-bottom:22px">You may also like</h2>
      <div class="rel-carousel">
        <button class="rel-arrow prev" aria-label="Previous" onclick="scrollRel(-1)">‹</button>
        <div class="rel-track" id="relatedGrid"></div>
        <button class="rel-arrow next" aria-label="Next" onclick="scrollRel(1)">›</button>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js?v=13"></script>
  <script src="js/components.js?v=13"></script>
  <script src="js/cart.js?v=13"></script>
  <script src="js/main.js"></script>
  <script>
    // Category → breadcrumb path (differs per category). Final crumb = the product's type.
    const CAT_TREE = {
      "Furniture":         ["Home & Garden", "Furniture", "Tables & Desks"],
      "Home Décor":        ["Home & Garden", "Home Décor", "Décor & Accents"],
      "Kitchen & Dining":  ["Home & Garden", "Kitchen & Dining", "Tableware"],
      "Bedroom & Bath":    ["Home & Garden", "Bedroom & Bath", "Linen & Textiles"],
      "Fragrance":         ["Home & Garden", "Fragrance", "Home Fragrance"],
      "Health & Wellness": ["Health & Wellness", "Bath & Body"],
      "Lifestyle":         ["Lifestyle", "Everyday Essentials"],
      "Gifts":             ["Gifts", "Gift Ideas"],
      "Travel Essentials": ["Travel Essentials", "On the Go"]
    };
    function buildCrumb(p) {
      const tree = CAT_TREE[p.cat] || [p.cat];
      const catHref = "shop.html?cat=" + encodeURIComponent(p.cat);
      const out = tree.map((label, i) =>
        `<a href="${(i === 0 && label !== p.cat) ? "index.html" : catHref}">${label}</a>`);
      let type = (p.specs && p.specs.Type) ? p.specs.Type : "";
      if (type && type.indexOf("/") === -1 && !/s$/i.test(type)) type += "s";
      if (type) out.push(`<span>${type}</span>`);
      return out.join(" / ");
    }

    // Stable "in carts right now" count per product (8–24)
    function cartWant(p) {
      let h = 0; for (let i = 0; i < p.id.length; i++) h = (h * 31 + p.id.charCodeAt(i)) >>> 0;
      return 8 + (h % 17);
    }
    let pdpQty = 1;
    let pdpColour = null;
    function pdpSetColour(name, btn) {
      pdpColour = name;
      const lbl = document.getElementById("pdpColourName");
      if (lbl) lbl.textContent = name;
      document.querySelectorAll(".pdp-swatch").forEach((s) => s.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }
    let pdpSize = null, pdpSizePrice = null;
    function pdpSetSize(label, price, btn) {
      pdpSize = label; pdpSizePrice = price;
      const nm = document.getElementById("pdpSizeName"); if (nm) nm.textContent = label;
      const pe = document.getElementById("pdpPrice"); if (pe) pe.textContent = money(price);
      const be = document.getElementById("pdpBnpl"); if (be) be.innerHTML = bnplBadge(price);
      document.querySelectorAll(".pdp-size").forEach((s) => s.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }
    function blurb(p) {
      const materials = { "Living/Indoor":"crafted for everyday comfort and effortless style",
        "Bedroom":"designed to bring calm and warmth to your space",
        "Dining & Kitchen":"made to gather around and enjoy for years",
        "Decor":"a considered finishing touch that ties a room together" };
      return `The ${p.name} is one of our most-loved DecoMuse pieces, ${materials[p.cat] || "beautifully made and built to last"}. Thoughtfully selected for quality and timeless appeal, it's the kind of piece that makes a house feel like home.`;
    }

    // Deterministic per-product review stats (stable across reloads)
    function reviewStats(p) {
      let h = 2166136261;
      for (let i = 0; i < p.id.length; i++) { h ^= p.id.charCodeAt(i); h = (h * 16777619) >>> 0; }
      const rnd = (n) => { h = (h * 1103515245 + 12345) >>> 0; return h % n; };
      let c5 = 120 + rnd(90);
      let c4 = 12 + rnd(18);
      let c3 = 3 + rnd(7);
      let c2 = 1 + rnd(5);
      let c1 = rnd(4);
      const dist = [c5, c4, c3, c2, c1];
      const total = c5 + c4 + c3 + c2 + c1;
      const avg = (5 * c5 + 4 * c4 + 3 * c3 + 2 * c2 + 1 * c1) / total;
      return { total, dist, avg: Math.round(avg * 10) / 10 };
    }
    function stars(avg) {
      const full = Math.round(avg);
      return "★★★★★".slice(0, full) + "☆☆☆☆☆".slice(0, 5 - full);
    }
    function productReviews(p) {
      const s = reviewStats(p);
      const max = Math.max.apply(null, s.dist) || 1;
      const rows = [5, 4, 3, 2, 1].map((star, i) => {
        const c = s.dist[i];
        return `<div class="rv-row"><span class="rv-star">${star} star</span>`
          + `<span class="rv-bar"><span class="rv-fill" style="width:${Math.round((c / max) * 100)}%"></span></span>`
          + `<span class="rv-count">${c}</span></div>`;
      }).join("");
      return `
      <section class="pdp-reviews">
        <h2>Reviews</h2>
        <div class="rv-verified">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="m9 12 2 2 4-4"/></svg>
          All reviews are from people who have purchased the item from us
        </div>
        <p class="rv-guidelines">Read our review <a href="policy.html?doc=returns">Publishing Guidelines</a></p>
        <div class="rv-summary">
          <div class="rv-score">
            <div class="rv-avg">${s.avg.toFixed(1)}</div>
            <div class="rv-score-stars">${stars(s.avg)}</div>
            <div class="rv-total">${s.total} reviews</div>
          </div>
          <div class="rv-bars">${rows}</div>
        </div>
        <p class="rv-note">Incentives to write honest reviews may be offered to people who have purchased the item</p>
      </section>`;
    }

    // "Review this product" — per-product review submission (email required for verification)
    let prfRating = 0;
    function productReviewForm(p) {
      return `
      <section class="pdp-review-form" id="reviewForm">
        <h3>Review this product</h3>
        <div class="prf-stars" id="prfStars">
          ${[1,2,3,4,5].map(n => `<button type="button" class="prf-star" data-n="${n}" onclick="prfSetStar(${n})" aria-label="${n} star${n > 1 ? "s" : ""}">☆</button>`).join("")}
        </div>
        <p class="prf-note">Adding a review will require a valid email for verification</p>
        <form id="prfForm" class="prf-form" style="display:none" onsubmit="return submitProductReview(event, '${p.id}')">
          <div class="field-row">
            <div class="field"><label>Name</label><input id="prfName" required></div>
            <div class="field"><label>Email <small style="color:var(--muted)">(for verification)</small></label><input id="prfEmail" type="email" required></div>
          </div>
          <div class="field"><label>Headline</label><input id="prfTitle" placeholder="Sum up your review"></div>
          <div class="field"><label>Your review</label><textarea id="prfBody" required style="min-height:100px" placeholder="What did you love about it?"></textarea></div>
          <button type="submit" class="btn btn--dark">Submit review</button>
          <div class="form-success" id="prfSuccess"></div>
        </form>
      </section>`;
    }
    function prfSetStar(n) {
      prfRating = n;
      document.querySelectorAll("#prfStars .prf-star").forEach(b => {
        const on = (+b.dataset.n <= n);
        b.classList.toggle("on", on);
        b.textContent = on ? "★" : "☆";
      });
      const form = document.getElementById("prfForm");
      if (form) form.style.display = "";
    }
    async function submitProductReview(e, id) {
      e.preventDefault();
      if (!prfRating) { showToast("Please choose a star rating"); return false; }
      const btn = e.target.querySelector('button[type="submit"]');
      const prod = (typeof PRODUCTS !== "undefined") ? PRODUCTS.find(x => x.id === id) : null;
      const data = [
        ["Product", (prod ? prod.name : id) + " (" + id + ")"],
        ["Rating", prfRating + " / 5"],
        ["Name", document.getElementById("prfName").value],
        ["Email", document.getElementById("prfEmail").value],
        ["Headline", document.getElementById("prfTitle").value],
        ["Review", document.getElementById("prfBody").value]
      ].filter(d => d[1]);
      if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }
      try { if (typeof deliverForm === "function") await deliverForm(data, "DecoMuse — New product review (pending email verification)"); } catch (err) {}
      const ok = document.getElementById("prfSuccess");
      if (ok) { ok.classList.add("show"); ok.innerHTML = "Thank you! Your review has been submitted. We'll email you to verify it, then publish it to this product. ✦"; }
      e.target.reset(); prfRating = 0;
      document.querySelectorAll("#prfStars .prf-star").forEach(b => { b.classList.remove("on"); b.textContent = "☆"; });
      if (btn) { btn.disabled = false; btn.textContent = "Submit review"; }
      return false;
    }

    function productSpecs(p) {
      let html = "";
      if (p.features && p.features.length)
        html += `<div class="pdp-spec-block"><h3>Highlights</h3><ul class="pdp-highlights">${p.features.map(f => `<li>${f}</li>`).join("")}</ul></div>`;
      if (p.dimensions || p.weight) {
        html += `<div class="pdp-spec-block"><h3>Dimensions &amp; Weights</h3><ul class="pdp-detail-list">`;
        if (p.dimensions) html += `<li><span>Overall</span><span>${p.dimensions}</span></li>`;
        if (p.weight) html += `<li><span>Product weight</span><span>${p.weight}</span></li>`;
        html += `</ul></div>`;
      }
      if (p.specs) {

            <p style="margin-top:16px">${p.desc || blurb(p)}</p>
            <ul class="pdp-detail-list">
              ${p.brand ? `<li><span>Brand</span><span>${p.brand}</span></li>` : ""}
              <li><span>Category</span><span>${p.cat}</span></li>
              <li><span>SKU</span><span>${p.sku || "DM-" + p.id.toUpperCase()}</span></li>
              ${p.custom ? `<li><span>Made to order</span><span style="color:var(--rose-deep)">Customisable · allow extra time</span></li>` : ""}

              <div class="pdp-swatches">${p.colours.map((c, i) => `<button type="button" class="pdp-swatch ${i === 0 ? 'active' : ''}" style="background:${c.hex}" aria-label="${c.name}" title="${c.name}" onclick="pdpSetColour('${c.name.replace(/'/g, "\\'")}', this)"></button>`).join("")}</div>

            <div class="pdp-buy">

              <button type="button" class="wa" onclick="shareWhatsApp('${(p.name || '').replace(/'/g, "\\'")}')">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.8-.9-2-1s-.5-.15-.7.15-.8 1-1 1.2-.4.2-.7.05a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.6-2c-.2-.3 0-.5.1-.65s.3-.35.45-.5a2 2 0 0 0 .3-.5.55.55 0 0 0 0-.5c0-.15-.7-1.65-.9-2.25s-.5-.5-.7-.5h-.6a1.1 1.1 0 0 0-.8.4A3.4 3.4 0 0 0 5.6 9c0 1.5 1.1 2.95 1.25 3.15s2.15 3.3 5.2 4.6a17 17 0 0 0 1.75.65 4.2 4.2 0 0 0 1.9.12c.6-.1 1.8-.75 2-1.45s.2-1.35.15-1.45-.25-.2-.55-.35zM12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.3A10 10 0 1 0 12 2z"/></svg>
                Share on WhatsApp

              <button type="button" onclick="copyProductLink(this)"><span aria-hidden="true">🔗</span> <span class="cl-lbl">Copy link</span></button>

      wrap.insertAdjacentHTML("beforeend", productSpecs(p) + productReviews(p) + productReviewForm(p));

    function shareWhatsApp(name) {
      const url = location.href;
      const text = `Check out the ${name} on DecoMuse ✦ ${url}`;
      if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
        navigator.share({ title: name, text: `Check out the ${name} on DecoMuse ✦`, url }).catch(() => {});
        return;
      }
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
    }
    function copyProductLink(btn) {
      const url = location.href;
      const lbl = btn.querySelector(".cl-lbl");
      const done = () => { if (lbl) { lbl.textContent = "Copied!"; setTimeout(() => lbl.textContent = "Copy link", 1600); } showToast("Product link copied ✦"); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("Copy this link:", url));
      else prompt("Copy this link:", url);
    }
    function scrollRel(dir){ const t = document.getElementById("relatedGrid"); if (t) t.scrollBy({ left: dir * 280, behavior: "smooth" }); }
    function setPdpQty(d){ pdpQty = Math.max(1, pdpQty + d); document.getElementById("pdpQty").textContent = pdpQty; }

    /* ============ Furniture viewer tools ============ */
    function findProd(id){ return (typeof PRODUCTS !== "undefined") && PRODUCTS.find(x => x.id === id); }
    function ensureToolOverlay(){
      let o = document.getElementById("toolOverlay");
      if (!o){
        o = document.createElement("div");
        o.id = "toolOverlay"; o.className = "tool-overlay";
        o.innerHTML = `<div class="tool-panel"><button class="tool-close" aria-label="Close" onclick="closeTool()">✕</button><div id="toolBody"></div></div>`;
        document.body.appendChild(o);
        o.addEventListener("click", (e) => { if (e.target === o) closeTool(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTool(); });
      }
      return o;
    }
    function openTool(html){
      const o = ensureToolOverlay();
      document.getElementById("toolBody").innerHTML = html;
      o.classList.add("open"); document.body.style.overflow = "hidden";
    }
    function closeTool(){
      const o = document.getElementById("toolOverlay");
      if (o){ o.classList.remove("open"); document.body.style.overflow = ""; }
      if (window._spin){ window._spin.stop && window._spin.stop(); window._spin = null; }
    }

    /* ---- 1. Dimensions (ruler) ---- */
    function openDims(id){
      const p = findProd(id); if (!p) return;
      const d = p.dims;
      let body;
      if (d && (d.w || d.h || d.d)){
        const u = d.unit || "cm";
        const photo = d.img || (p.imgs && p.imgs[0]) || p.img || ("assets/products/" + p.id + ".jpg");
        const diagram = d.printed
          ? `<div class="dim-box"><div class="dim-plain"><img src="${photo}" alt="${p.name} dimensions" onerror="this.closest('.dim-plain').style.display='none'"></div></div>`
          : `<div class="dim-box">
              <div class="dim-photo">
                <div class="dim-frame"><img src="${photo}" alt="${p.name}" onerror="this.closest('.dim-frame').style.display='none'"></div>
                ${d.h ? `<div class="dim-mark dim-v"><span>${d.h} ${u}</span></div>` : ""}
                ${d.w ? `<div class="dim-mark dim-h"><span>${d.w} ${u}</span></div>` : ""}
              </div>
            </div>
            ${d.d ? `<div style="text-align:center"><span class="dim-depth">⇲ Depth ${d.d} ${u}</span></div>` : ""}`;
        body = `<h3>Dimensions</h3><p class="th-sub">${p.name}</p>
          ${diagram}
          <ul class="dim-list">
            ${d.w ? `<li><span>Width</span><strong>${d.w} ${u}</strong></li>` : ""}
            ${d.d ? `<li><span>Depth</span><strong>${d.d} ${u}</strong></li>` : ""}
            ${d.h ? `<li><span>Height</span><strong>${d.h} ${u}</strong></li>` : ""}
          </ul>
          ${d.note ? `<p class="dim-note">${d.note}</p>` : ""}
          <p class="dim-note">Measurements are approximate. Please allow a small tolerance for handmade & natural finishes.</p>`;
      } else {
        body = `<h3>Dimensions</h3><p class="th-sub">${p.name}</p><p>Detailed dimensions for this piece are being added. In the meantime, please <a href="contact.html">contact us</a> for exact sizing.</p>`;
      }
      openTool(body);
    }

    /* ---- 2. See it in your room (3D / AR) ---- */
    function openRoomView(id){
      const p = findProd(id); if (!p) return;
      const url = location.origin + "/ar.html?id=" + p.id;
      // Real AR when a 3D model is supplied; otherwise the QR "see in your room" flow.
      if (p.model3d){
        if (!window.customElements || !customElements.get("model-viewer")){
          const s = document.createElement("script");
          s.type = "module"; s.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
          document.head.appendChild(s);
        }
        openTool(`<h3>See it in your room</h3><p class="th-sub">${p.name}</p>
          <model-viewer src="${p.model3d}" ${p.modelUsdz ? `ios-src="${p.modelUsdz}"` : ""} camera-controls auto-rotate ar ar-modes="scene-viewer webxr quick-look" alt="${p.name} in 3D"></model-viewer>
          <p class="ar-fine">Tap the AR icon (bottom-right of the 3D view) on a supported phone to place this piece in your room.</p>`);
        return;
      }
      const qr = "https://api.qrserver.com/v1/create-qr-code/?size=380x380&margin=8&data=" + encodeURIComponent(url);
      openTool(`<div class="ar-body">
        <div class="ar-phone">📱</div>
        <h3>See how it looks in your room!</h3>
        <p class="th-sub">Scan the QR code with your phone and select "See it in your room". 3D imagery is indicative only.</p>
        <img class="ar-qr" src="${qr}" alt="Scan to view ${p.name} on your phone" onerror="this.style.display='none'">
        <div class="ar-steps">
          <div>1. Open your phone camera and point it at the code above.</div>
          <div>2. Tap the link to open the piece on your phone.</div>
          <div>3. Tap <strong>See in your room</strong> to place it with your camera.</div>
        </div>
        <p class="ar-fine">*Requires an AR-supported device & browser. We recommend iOS 12 or later with Safari, or Android 7.0 or later with Chrome.</p>
      </div>`);
    }

    /* ---- 3. 360° spin ---- */
    async function openSpin(id){
      const p = findProd(id); if (!p) return;
      // True 3D orbit (drag + arrow keys) when a model exists; else photo spin.
      const glb = p.model3d || ("assets/models/" + p.id + ".glb");
      const hasGlb = await fetch(glb, { method: "HEAD" }).then(r => r.ok).catch(() => false);
      if (hasGlb){
        if (!window.customElements || !customElements.get("model-viewer")){
          const s = document.createElement("script");
          s.type = "module"; s.src = "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
          document.head.appendChild(s);
        }
        openTool(`<h3>360° view</h3><p class="th-sub">Drag with your mouse, swipe, or use your arrow keys to rotate ${p.name} and view it from every angle.</p>
          <model-viewer src="${glb}" ${p.modelUsdz ? `ios-src="${p.modelUsdz}"` : ""} camera-controls auto-rotate interaction-prompt="none" shadow-intensity="1" tabindex="0" style="width:100%;height:60vh;background:#fff;border-radius:12px" alt="${p.name} in 3D"></model-viewer>
          <p class="ar-fine">Tip: click the piece first, then use ← → ↑ ↓ to orbit around it.</p>`);
        setTimeout(() => { const mv = document.querySelector(".tool-panel model-viewer"); if (mv) mv.focus(); }, 300);
        return;
      }
      const frames = (p.spin360 && p.spin360.length) ? p.spin360 : ((p.imgs && p.imgs.length) ? p.imgs : (p.img ? [p.img] : []));
      const real360 = !!(p.spin360 && p.spin360.length);
      if (!frames.length){ showToast("No images available to spin"); return; }
      const multi = frames.length > 1;
      openTool(`<h3>360° view</h3><p class="th-sub">${multi ? "Drag left or right to view " + p.name + " from every angle." : "Click and drag to move " + p.name + " around."}</p>
        <div class="spin-stage" id="spinStage">
          <img id="spinImg" src="${frames[0]}" alt="${p.name}">
          <span class="spin-hint">↤ drag to move ↦</span>
        </div>
        ${multi ? "" : `<div class="spin-controls"><button type="button" onclick="spinReset()">↺ Reset view</button></div>`}`);
      const state = { frames, i: 0, dragging: false, lastX: 0, lastY: 0, rx: 0, ry: 0, timer: null };
      window._spin = state;
      const stage = document.getElementById("spinStage");
      const img = document.getElementById("spinImg");
      const setFrame = () => { img.src = frames[((state.i % frames.length) + frames.length) % frames.length]; };
      state.set = setFrame;
      state.stop = () => { if (state.timer){ clearInterval(state.timer); state.timer = null; } };
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      if (!multi){ stage.style.perspective = "1100px"; img.style.transition = "transform .12s ease-out"; img.style.willChange = "transform"; }
      state.applyTilt = () => { img.style.transform = `rotateX(${state.rx}deg) rotateY(${state.ry}deg)`; };
      const DRAG_PX_PER_FRAME = 42;  // drag distance to advance a frame (multi-frame sets only)
      const onDown = (x, y) => { state.dragging = true; state.lastX = x; state.lastY = y; stage.classList.add("dragging"); };
      const onMove = (x, y) => {
        if (!state.dragging) return;
        if (multi){
          const dx = x - state.lastX;
          if (Math.abs(dx) >= DRAG_PX_PER_FRAME){ state.i += dx > 0 ? 1 : -1; setFrame(); state.lastX = x; }
        } else {
          state.ry = clamp(state.ry + (x - state.lastX) / 3.2, -60, 60);
          state.rx = clamp(state.rx - (y - state.lastY) / 4, -35, 35);
          state.applyTilt();
          state.lastX = x; state.lastY = y;
        }
      };
      const onUp = () => { state.dragging = false; stage.classList.remove("dragging"); };
      stage.addEventListener("mousedown", (e) => { e.preventDefault(); onDown(e.clientX, e.clientY); });
      window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
      window.addEventListener("mouseup", onUp);
      stage.addEventListener("touchstart", (e) => onDown(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      stage.addEventListener("touchmove", (e) => { onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
      stage.addEventListener("touchend", onUp);
    }
    function spinReset(){ const s = window._spin; if (!s || !s.applyTilt) return; s.rx = 0; s.ry = 0; s.applyTilt(); }

    /* ---- 4. Scan QR → open this product's details on a phone (no AR) ---- */
    function openScan(id){
      const p = findProd(id); if (!p) return;
      const url = location.origin + "/product.html?id=" + p.id;
      const qr = "https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=10&data=" + encodeURIComponent(url);
      openTool(`<div class="ar-body">
        <div class="ar-phone">🔗</div>
        <h3>Scan to view this product</h3>
        <p class="th-sub">Point a phone camera at the code to open <strong>${p.name}</strong> — full details, photos and dimensions. Handy for showing family or friends.</p>
        <img class="ar-qr" src="${qr}" alt="Scan to view ${p.name}" onerror="this.style.display='none'">
        <p class="ar-fine">Opens the product page — no app needed.</p>
      </div>`);
    }

    render();
  </script>
</body>
</html>

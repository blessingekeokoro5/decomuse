<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account, DecoMuse</title>
  <meta name="description" content="Log in or sign up to your DecoMuse account, manage your membership, view your 20% welcome coupon and saved favourites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .acc-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
    .acc-tabs button { flex: 1; padding: 12px; border: 1.5px solid var(--line); background: #fff; border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 0.9rem; color: var(--ink); cursor: pointer; transition: all var(--tr); }
    .acc-tabs button.active { background: var(--rose); color: #fff; border-color: var(--rose); }
    /* Membership card */
    .mcard { background: linear-gradient(140deg, var(--forest), var(--forest-2)); color: #fff; border-radius: var(--radius-lg);
      padding: 34px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
    .mcard::after { content: "✦"; position: absolute; right: 24px; top: 18px; font-size: 5rem; opacity: 0.14; }
    .mcard .tier { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--rose-soft); }
    .mcard h2 { color: #fff; margin: 6px 0 4px; }
    .mcard .since { color: #d7e0cd; font-size: 0.88rem; }
    .coupon { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.12);
      border: 1px dashed rgba(255,255,255,0.5); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 24px; }
    .coupon .code { font-family: var(--font-head); font-size: 1.5rem; letter-spacing: 0.08em; color: #fff; }
    .coupon small { display: block; color: #d7e0cd; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .acc-links { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-top: 24px; }
    .acc-link { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: var(--ink); }
    .acc-link:hover { background: var(--cream-2); }
    .acc-link .ic { font-size: 1.5rem; }
    /* ID-style member card */
    .mcard .mc-top { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 1; }
    .mcard .brand { font-family: var(--font-head); font-size: 1.7rem; font-weight: 600; }
    .mcard .mc-grid { display: flex; gap: 44px; margin-top: 18px; position: relative; z-index: 1; }
    .mcard .mc-grid small { display: block; font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rose-soft); margin-bottom: 3px; }
    .mcard .mc-grid strong { font-size: 1.05rem; letter-spacing: 0.05em; font-family: 'Jost', monospace; }
    .mcard .mc-abn { margin-top: 20px; font-size: 0.76rem; color: #d7e0cd; letter-spacing: 0.02em; position: relative; z-index: 1; }
    .reward { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--blush);
      border: 1px dashed var(--rose-soft); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 22px; }
    .reward .code { font-family: var(--font-head); font-size: 1.4rem; color: var(--rose-deep); letter-spacing: 0.06em; }
    .reward small { display: block; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .orders-list { margin-top: 14px; }
    .order-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .order-row .o-meta strong { display: block; }
    .order-row .o-meta small { color: var(--muted); font-size: 0.82rem; }
    .acc-h3 { font-size: 1.2rem; margin: 30px 0 4px; }
    /* Rewards */
    .rewards-card { background: linear-gradient(150deg, var(--forest), var(--forest-2)); color: #fff; border-radius: var(--radius-lg); padding: 22px 24px; margin-top: 22px; }
    .rewards-card .rw-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .rw-pts-label { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--rose-soft); }
    .rw-pts { font-family: var(--font-head); font-size: 1.9rem; }
    .rw-bar { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; margin: 14px 0 8px; overflow: hidden; }
    .rw-bar span { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
    .rewards-card .rw-hint { font-size: .8rem; color: #e4dbcf; line-height: 1.5; }
    .rw-redeem { background: #fff; color: var(--forest); border: none; border-radius: 99px; padding: 10px 16px; font-family: var(--font-body); font-weight: 600; cursor: pointer; white-space: nowrap; }
    .rw-redeem:disabled { opacity: .5; cursor: not-allowed; }
    .voucher { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px dashed var(--rose-soft); background: var(--blush); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .voucher .v-amt { font-family: var(--font-head); font-size: 1.3rem; color: var(--rose-deep); }
    .voucher .v-code { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
    .bday-box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; font-size: 0.92rem; }
  </style>
</head>
<body data-page="account.html">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / My Account</div>
      <span class="eyebrow">Your account</span>
      <h1 id="accTitle">My account</h1>
      <p id="accSub">Log in or create a free account to manage your membership, coupon and saved favourites.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:760px">
      <div id="accWrap"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    let accMode = "signup";
    if (location.hash === "#login") accMode = "login";

    function render() {
      const acc = getAccount();
      const wrap = document.getElementById("accWrap");
      if (acc && acc.email) { renderDashboard(acc); return; }

      document.getElementById("accTitle").textContent = "My account";
      wrap.innerHTML = `
        <div class="form-card reveal">
          <div class="acc-tabs">
            <button class="${accMode==='signup'?'active':''}" onclick="setMode('signup')">Sign up</button>
            <button class="${accMode==='login'?'active':''}" onclick="setMode('login')">Log in</button>
          </div>
          <div id="accForm"></div>
        </div>`;
      renderForm();
      initReveal();
    }

    function setMode(m){ accMode = m; render(); }

    function renderForm() {
      const el = document.getElementById("accForm");
      if (accMode === "signup") {
        el.innerHTML = `
          <div style="background:var(--blush);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;font-size:0.9rem;color:var(--rose-deep)">
            🎉 Join free and get <strong>20% off your first order</strong> plus member perks.
          </div>
          <form onsubmit="return doSignup(event)">
            <div class="field"><label>Full name</label><input id="suName" required></div>
            <div class="field"><label>Email</label><input id="suEmail" type="email" required></div>
            <div class="field"><label>Create a password</label><input id="suPass" type="password" required></div>
            <button type="submit" class="btn btn--primary btn--block">Create my account &amp; get 20% off</button>
          </form>`;
      } else {
        el.innerHTML = `
          <form onsubmit="return doLogin(event)">
            <div class="field"><label>Email</label><input id="liEmail" type="email" required></div>
            <div class="field"><label>Password</label><input id="liPass" type="password" required></div>
            <button type="submit" class="btn btn--primary btn--block">Log in</button>
            <p class="form-note" style="text-align:center;margin-top:12px">New here? <a href="#" onclick="setMode('signup');return false;">Create an account</a> for 20% off.</p>
          </form>`;
      }
    }

    function doSignup(e) {
      e.preventDefault();
      const name = document.getElementById("suName").value.trim();
      const email = document.getElementById("suEmail").value.trim();
      saveAccount({ name, email, member: true, memberSince: todayAU(), coupon: "WELCOME20", memberNo: genMemberNo(), orders: [],
        points: 0, vouchers: [{ code: genVoucherCode(), amount: 10, label: "Welcome voucher" }] });
      try { localStorage.setItem("dm_member","1"); } catch(err){}
      showToast("Welcome to DecoMuse! Your 20% code is ready 🎉");
      render();
      return false;
    }
    function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById("liEmail").value.trim();
      const existing = getAccount();
      // Demo: log into existing account, or create a lightweight member on the fly
      const acc = (existing && existing.email) ? existing
        : { name: "", email, member: true, memberSince: todayAU(), coupon: "WELCOME20" };
      acc.email = email;
      saveAccount(acc);
      showToast("Welcome back! 👋");
      render();
      return false;
    }

    function renderDashboard(acc) {
      // Ensure every member has a stable membership number
      let changed = false;
      if (!acc.memberNo) { acc.memberNo = genMemberNo(); changed = true; }
      if (!Array.isArray(acc.orders)) { acc.orders = getStoredOrders(acc.email); changed = true; }
      if (typeof acc.points !== "number") { acc.points = 0; changed = true; }
      if (!Array.isArray(acc.vouchers)) { acc.vouchers = []; changed = true; }
      if (changed) saveAccount(acc);

      document.getElementById("accTitle").textContent = acc.name ? `Hello, ${acc.name.split(" ")[0]} 👋` : "My account";
      document.getElementById("accSub").textContent = "Your membership card, coupon, orders and saved favourites.";
      const wishN = wishlistCount();
      const orders = acc.orders || [];
      document.getElementById("accWrap").innerHTML = `
        <div class="mcard reveal" id="memberCard">
          <div class="mc-top"><span class="brand">DecoMuse</span><span class="tier">Member Card</span></div>
          <h2>${acc.name || acc.email}</h2>
          <div class="mc-grid">
            <div><small>Member No.</small><strong id="memberNo">${acc.memberNo}</strong></div>
            <div><small>Member since</small><strong>${acc.memberSince || "today"}</strong></div>
          </div>
          <div class="mc-abn">ABN 41 991 812 955 · ${acc.email}</div>
        </div>
        <div style="text-align:center;margin:16px 0 4px">
          <button class="btn btn--dark btn--sm" onclick="downloadCard()">⬇ Download member card</button>
          <p class="form-note" style="margin-top:8px">Keep this card for identification and security when you shop with us in store or by phone.</p>
        </div>

        <div class="reward">
          <div>
            <small>Your welcome reward, 20% off</small>
            <span class="code" id="couponCode">${acc.coupon || "WELCOME20"}</span>
          </div>
          <button class="btn btn--dark btn--sm" onclick="copyCoupon()">Copy code</button>
        </div>

        <h3 class="acc-h3">DecoMuse Rewards</h3>
        ${rewardsHtml(acc)}

        <h3 class="acc-h3">Your orders &amp; receipts</h3>
        <div class="orders-list" id="ordersList">${renderOrders(orders)}</div>

        <div class="acc-links">
          <a class="acc-link" href="wishlist.html"><div class="ic">♡</div><strong>Wishlist</strong><div style="color:var(--muted);font-size:0.85rem">${wishN} saved</div></a>
          <a class="acc-link" href="track.html"><div class="ic">📦</div><strong>Track order</strong><div style="color:var(--muted);font-size:0.85rem">View status</div></a>
          <a class="acc-link" href="cart.html"><div class="ic">🛒</div><strong>My cart</strong><div style="color:var(--muted);font-size:0.85rem">${cartCount()} items</div></a>
          <a class="acc-link" href="shop.html"><div class="ic">🛍️</div><strong>Shop</strong><div style="color:var(--muted);font-size:0.85rem">Keep browsing</div></a>
        </div>

        <div style="text-align:center;margin-top:28px">
          <button class="btn btn--outline btn--sm" onclick="doLogout()">Log out</button>
        </div>`;
      initReveal();
    }

    // ---- Membership number ----
    function genMemberNo() {
      const n = Math.floor(1000000000 + Math.random() * 8999999999).toString();
      return n.slice(0, 4) + " " + n.slice(4, 7) + " " + n.slice(7);
    }

    // ---- DecoMuse Rewards (points → vouchers) ----
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    function genVoucherCode() { return "DM-V" + Math.floor(1000 + Math.random() * 9000) + "-" + Math.floor(1000 + Math.random() * 9000); }
    function rewardsHtml(acc) {
      const pts = acc.points || 0;
      const inCycle = pts % 100;
      const toNext = 100 - inCycle;
      return `
        <div class="rewards-card">
          <div class="rw-top">
            <div><span class="rw-pts-label">Points balance</span><div class="rw-pts">${pts} pts</div></div>
            <button class="rw-redeem" onclick="redeemPoints()" ${pts < 100 ? "disabled" : ""}>Redeem 100 pts → $10 voucher</button>
          </div>
          <div class="rw-bar"><span style="width:${inCycle}%"></span></div>
          <div class="rw-hint">${pts >= 100 ? "You have a reward ready to redeem! " : ""}${toNext} pts to your next $10 voucher · $1 = 1 point · <strong>2× points on gift purchases &amp; personal shopping projects</strong></div>
        </div>
        <div style="margin-top:14px">${vouchersHtml(acc)}</div>
        ${birthdayHtml(acc)}`;
    }
    function vouchersHtml(acc) {
      const vs = (acc.vouchers || []).filter(v => !v.used);
      if (!vs.length) return `<p style="color:var(--muted);font-size:0.9rem">No vouchers yet, earn 100 points for a $10 voucher, or add your birthday for a $20 treat.</p>`;
      return vs.map((v) => `
        <div class="voucher">
          <div><div class="v-amt">$${v.amount} voucher</div><div class="v-code">${v.label || "Reward"} · Code ${v.code}</div></div>
          <button class="btn btn--dark btn--sm" onclick="applyVoucher('${v.code}')">Apply to next order</button>
        </div>`).join("");
    }
    function birthdayHtml(acc) {
      if (acc.birthday) return `<div class="bday-box">🎂 Birthday saved (<strong>${acc.birthday}</strong>). Your <strong>$20 birthday voucher</strong> lands in your birthday month each year.</div>`;
      return `<div class="bday-box">🎂 <strong>Add your birthday</strong> to unlock a $20 birthday voucher each year.
        <div style="display:flex;gap:8px;margin-top:10px">
          <select id="bdayMonth" style="flex:1;padding:10px;border:1.5px solid var(--line);border-radius:8px;font-family:var(--font-body)">${MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("")}</select>
          <button class="btn btn--outline btn--sm" onclick="saveBirthday()">Save</button>
        </div></div>`;
    }
    function redeemPoints() {
      const acc = getAccount(); if (!acc) return;
      if ((acc.points || 0) < 100) { showToast("You need 100 points to redeem"); return; }
      acc.points -= 100;
      acc.vouchers = acc.vouchers || [];
      acc.vouchers.push({ code: genVoucherCode(), amount: 10, label: "Points reward" });
      saveAccount(acc);
      showToast("Redeemed! Your $10 voucher is ready 🎉");
      renderDashboard(getAccount());
    }
    function applyVoucher(code) {
      const acc = getAccount();
      const v = (acc.vouchers || []).find(x => x.code === code && !x.used);
      if (!v) return;
      if (typeof setVoucher === "function") setVoucher({ code: v.code, amount: v.amount });
      showToast("Voucher applied, it'll show at checkout ✦");
      location.href = "cart.html";
    }
    function saveBirthday() {
      const acc = getAccount(); if (!acc) return;
      const m = parseInt(document.getElementById("bdayMonth").value, 10);
      acc.birthday = MONTHS[m - 1];
      acc.vouchers = acc.vouchers || [];
      const now = new Date();
      if (m === now.getMonth() + 1 && acc.bdayGrantedYear !== now.getFullYear()) {
        acc.vouchers.push({ code: genVoucherCode(), amount: 20, label: "Birthday voucher" });
        acc.bdayGrantedYear = now.getFullYear();
        saveAccount(acc);
        showToast("Happy birthday month! Your $20 voucher is ready 🎂");
      } else {
        saveAccount(acc);
        showToast("Birthday saved 🎂");
      }
      renderDashboard(getAccount());
    }

    // ---- Orders & receipts ----
    function getStoredOrders(email) {
      try {
        const all = JSON.parse(localStorage.getItem("dm_orders") || "{}");
        return (email && all[email]) ? all[email] : [];
      } catch (e) { return []; }
    }
    function renderOrders(orders) {
      if (!orders || !orders.length) {
        return `<div style="border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">
          You have no orders yet. <a href="shop.html">Start shopping →</a><br>
          <small>Your receipts will appear here after checkout.</small></div>`;
      }
      return orders.map((o, i) => `
        <div class="order-row">
          <div class="o-meta">
            <strong>Order ${o.orderNo}</strong>
            <small>${o.date || ""} · ${(o.items || []).reduce((s, it) => s + (it.qty || 1), 0)} item(s)</small>
          </div>
          <div style="text-align:right">
            <div class="price" style="font-family:var(--font-head)">${money(o.total || 0)}</div>
            <button class="link-remove" style="color:var(--rose-deep)" onclick="viewReceipt(${i})">View receipt</button>
          </div>
        </div>`).join("");
    }
    function viewReceipt(i) {
      const acc = getAccount();
      const o = (acc.orders || [])[i];
      if (!o) return;
      const rows = (o.items || []).map(it =>
        `<tr><td>${it.name || it.id}${it.qty > 1 ? " × " + it.qty : ""}</td><td style="text-align:right">${money((it.price || 0) * (it.qty || 1))}</td></tr>`
      ).join("");
      const w = window.open("", "_blank", "width=460,height=680");
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt ${o.orderNo}</title>
        <style>body{font-family:Georgia,serif;color:#2C2623;max-width:420px;margin:24px auto;padding:0 20px}
        h1{font-size:1.5rem;color:#47563B;margin:0}.sub{color:#888;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
        table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.92rem}td{padding:7px 0;border-bottom:1px solid #eee}
        .tot td{border:0;font-weight:700;padding-top:12px}.meta{font-size:.85rem;color:#555;margin:10px 0}
        .thanks{margin-top:24px;color:#B67280}button{margin-top:20px;padding:10px 18px;background:#47563B;color:#fff;border:0;border-radius:8px;cursor:pointer;font-family:inherit}
        @media print{button{display:none}}</style></head><body>
        <h1>DecoMuse</h1><div class="sub">Purchase receipt</div>
        <div class="meta"><strong>Order ${o.orderNo}</strong><br>${o.date || ""}<br>${acc.name || ""} · ${acc.email}<br>Member No. ${acc.memberNo || ""}</div>
        <table>${rows}
          ${o.shipping ? `<tr><td>Shipping</td><td style="text-align:right">${money(o.shipping)}</td></tr>` : `<tr><td>Shipping</td><td style="text-align:right">Free</td></tr>`}
          <tr class="tot"><td>Total (incl. GST)</td><td style="text-align:right">${money(o.total || 0)}</td></tr>
        </table>
        <div class="meta">ABN 41 991 812 955 · www.decomuse.com.au</div>
        <div class="thanks">Thank you for shopping with DecoMuse ✦</div>
        <button onclick="window.print()">🖨 Print / Save as PDF</button>
        </body></html>`);
      w.document.close();
    }

    // ---- Download membership card as a PNG ----
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function downloadCard() {
      const acc = getAccount(); if (!acc) return;
      const W = 1012, H = 640, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, "#47563B"); g.addColorStop(1, "#333f29");
      ctx.fillStyle = g; roundRect(ctx, 0, 0, W, H, 42); ctx.fill();
      // decorative sparkle
      ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.font = "260px Georgia, serif";
      ctx.fillText("✦", 690, 330);
      // brand + tier
      ctx.fillStyle = "#fff"; ctx.font = "600 58px Georgia, serif"; ctx.fillText("DecoMuse", 62, 118);
      ctx.fillStyle = "rgba(255,255,255,0.72)"; ctx.font = "500 22px Arial"; ctx.textAlign = "left";
      ctx.fillText("M E M B E R   C A R D", 66, 156);
      // name
      ctx.fillStyle = "#fff"; ctx.font = "700 52px Georgia, serif";
      ctx.fillText((acc.name || acc.email).slice(0, 26), 62, 360);
      // member number
      ctx.fillStyle = "#E9C6CF"; ctx.font = "500 20px Arial"; ctx.fillText("MEMBER NO.", 62, 420);
      ctx.fillStyle = "#fff"; ctx.font = "500 34px 'Courier New', monospace"; ctx.fillText(acc.memberNo || "", 62, 460);
      // since
      ctx.fillStyle = "#E9C6CF"; ctx.font = "500 20px Arial"; ctx.fillText("MEMBER SINCE", 560, 420);
      ctx.fillStyle = "#fff"; ctx.font = "500 30px Arial"; ctx.fillText(acc.memberSince || "today", 560, 458);
      // footer
      ctx.fillStyle = "rgba(215,224,205,0.9)"; ctx.font = "20px Arial";
      ctx.fillText("ABN 41 991 812 955  ·  www.decomuse.com.au", 62, 560);
      ctx.fillText((acc.email || "").slice(0, 46), 62, 594);
      const a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = "DecoMuse-Member-Card.png";
      document.body.appendChild(a); a.click(); a.remove();
      showToast("Member card downloaded ⬇");
    }

    function copyCoupon() {
      const code = document.getElementById("couponCode").textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => showToast("Coupon " + code + " copied! ✦"));
      else showToast("Your code is " + code);
    }
    function doLogout() { logoutAccount(); showToast("You've been logged out"); render(); }

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart, DecoMuse</title>
  <meta name="description" content="Your DecoMuse shopping cart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cart.html">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>
      <h1>Shopping Cart</h1>
      <div class="cart-id" id="cartId"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="cart-layout" id="cartLayout">
        <div class="cart-main">
          <div id="cartItems"></div>
          <div id="cartLower"></div>
        </div>
        <aside class="cart-aside" id="cartAside"></aside>
      </div>
    </div>
  </section>

  <!-- Sticky total bar (mobile) -->
  <div class="cart-sticky">
    <div class="container">
      <div class="cart-sticky-inner">
        <div class="cs-label"><strong>Total</strong> <small>(incl. GST)</small></div>
        <div class="cs-total" id="cartStickyTotal">$0.00</div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const CART_EMPTY_SVG = `<svg viewBox="0 0 24 24" width="58" height="58" fill="none" stroke="var(--rose-deep)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20.5" r="1.5"/><circle cx="17.5" cy="20.5" r="1.5"/><path d="M2 3h3l2.3 11.5a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.1L21.5 7H6"/><path d="M11.5 10.5h4M14 8l2.5 2.5L14 13"/></svg>`;

    function emptyCart() {
      if (!getCart().length) return;
      if (confirm("Remove all items from your cart?")) { saveCart([]); renderCartPage(); showToast("Cart emptied"); }
    }

    function confidenceCard(total) {
      const p4 = money(total / 4);
      return `
        <div class="conf-card">
          <div class="conf-head">SHOP <em>with</em> CONFIDENCE</div>
          <div class="conf-sec">
            <h4>Buy Today, Pay Later</h4>
            <p class="conf-muted">Available now, based on your cart:</p>
            <div class="conf-bnpl">
              <div class="cb-row"><span class="cb-badge cb-afterpay">afterpay</span> <span>4 payments of <strong>${p4}</strong></span></div>
              <div class="cb-row"><span class="cb-badge cb-zip">zip</span> <span>4 interest-free payments of <strong>${p4}</strong></span></div>
              <div class="cb-row"><span class="cb-badge cb-paypal">PayPal</span> <span>Pay in 4 with <strong>${p4}</strong></span></div>
            </div>
          </div>
          <div class="conf-sec">
            <h4>Returns &amp; Exchanges</h4>
            <p class="conf-muted">Shop with confidence — <strong>30-day returns</strong> and our satisfaction guarantee.</p>
          </div>
          <div class="conf-sec">
            <h4>We're Here to Help</h4>
            <p class="conf-muted">Our Australian-based team offers support <strong>7 days a week</strong>. <a href="contact.html">Contact us →</a></p>
          </div>
        </div>`;
    }

    function renderCartPage() {
      const cart = getCart();
      const items = document.getElementById("cartItems");
      const lower = document.getElementById("cartLower");
      const aside = document.getElementById("cartAside");
      const stickyTotal = document.getElementById("cartStickyTotal");
      const cartIdEl = document.getElementById("cartId");

      if (!cart.length) {
        items.innerHTML = `
          <div class="cart-empty-box">
            ${CART_EMPTY_SVG}
            <h3>Your cart is empty</h3>
            <p>Your shopping cart is currently empty. Discover curated pieces for every room, or let the Muse Stylist AI style your space.</p>
            <div class="btn-row" style="justify-content:center;margin-top:20px">
              <a class="btn btn--primary" href="shop.html">Shop the collection</a>
              <a class="btn btn--outline" href="stylist.html">✦ Try Muse Stylist AI</a>
            </div>
          </div>`;
        lower.innerHTML = "";
        aside.innerHTML = "";
        if (cartIdEl) cartIdEl.textContent = "";
        stickyTotal.textContent = money(0);
        return;
      }

      const sub = cartTotal();
      const disc = orderDiscount(sub);
      const discount = disc.amount;
      const afterDisc = sub - discount;
      const vou = (typeof getVoucher === "function") ? getVoucher() : null;
      const voucher = (vou && vou.amount) ? Math.min(vou.amount, afterDisc) : 0;
      const total = afterDisc - voucher; // shipping is calculated at checkout by region & weight
      const gst = total / 11;

      if (cartIdEl) cartIdEl.textContent = "Cart ID: " + (localStorage.getItem("dm_cart_id") || (function () { const id = "DM" + Math.floor(10000000 + Math.random() * 89999999); localStorage.setItem("dm_cart_id", id); return id; })());

      // ---- Items ----
      items.innerHTML = cart.map(i => {
        const prod = (typeof findProduct === "function") ? findProduct(i.id) : null;
        const src = i.img || (prod && (prod.img || (prod.imgs && prod.imgs[0]))) || ("assets/products/" + i.id + ".jpg");
        const sku = (prod && prod.sku) ? prod.sku : "";
        return `
        <div class="cart-line">
          <div class="thumb"><div class="ph ${i.ph}" data-label="${i.name}"><img class="ph-img" src="${src}" alt="${i.name}" onerror="this.remove()"></div></div>
          <div class="cl-info">
            <div class="cl-cat">${i.cat}</div>
            <h3 class="cl-name">${i.name}${(i.colour || i.size) ? ` <small>· ${[i.colour, i.size].filter(Boolean).join(" · ")}</small>` : ""}</h3>
            ${sku ? `<div class="cl-sku">${sku}</div>` : ""}
            ${afterDisc >= 500 ? `<div class="cl-bonus">BONUS: FREE DELIVERY</div>` : ""}
            <ul class="cart-deliv">
              <li>Delivered by a trusted supplier — track online</li>
              <li>Allow 3–8 business days for delivery — depending on your location</li>
              <li>Leaves our warehouse in 1–2 business days</li>
            </ul>
          </div>
          <div class="cl-price"><span class="cl-plabel">Price</span>${money(i.price)}</div>
          <div class="cl-qty">
            <span class="cl-plabel">Qty</span>
            <div class="qty">
              <button onclick="setQty('${i.key || i.id}', ${i.qty - 1})">−</button>
              <span>${i.qty}</span>
              <button onclick="setQty('${i.key || i.id}', ${i.qty + 1})">+</button>
            </div>
            <button class="link-remove" onclick="removeFromCart('${i.key || i.id}')">✕ Remove</button>
          </div>
          <div class="cl-sub"><span class="cl-plabel">Subtotal</span>${money(i.price * i.qty)}</div>
        </div>`;
      }).join("");

      // ---- Delivery (delivery only — no click & collect) + gift card + promo + totals + actions ----
      lower.innerHTML = `
        <div class="cart-panel cart-delivery">
          <h3>Delivery</h3>
          <label class="deliv-opt selected">
            <span class="deliv-ic">🚚</span>
            <span class="deliv-txt"><strong>Standard delivery</strong><small>Australia-wide &amp; New Zealand · 3–8 business days${shipping === 0 ? " · <span style='color:var(--forest)'>Free on this order</span>" : " · Free over $500"}</small></span>
            <span class="deliv-check">✓</span>
          </label>
          <p class="deliv-note">Same-day local delivery (Uber/DoorDash) is available on eligible metro orders — choose it at checkout.</p>
        </div>

        <details class="cart-panel cart-fold">
          <summary>🎁 Use a gift card</summary>
          <div class="fold-body">Have a DecoMuse gift card? You can redeem it securely at checkout — your balance will apply to this order.</div>
        </details>

        <details class="cart-panel cart-fold" ${window._coupon ? "open" : ""}>
          <summary>🏷️ Use a promotional code</summary>
          <div class="fold-body">
            <div style="display:flex;gap:8px">
              <input id="couponInput" placeholder="Promo code (try WELCOME20)" value="${window._coupon || ""}"
                     style="flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--font-body)">
              <button class="btn btn--outline btn--sm" onclick="applyCoupon()">Apply</button>
            </div>
            ${window._coupon === "WELCOME20" ? `<div style="font-size:0.82rem;color:var(--forest);margin-top:8px">✓ Member code applied — 20% off</div>` : ""}
          </div>
        </details>

        <div class="cart-totals">
          <div class="ct-row"><span>Subtotal</span><span>${money(sub)}</span></div>
          ${discount ? `<div class="ct-row" style="color:var(--forest)"><span>${disc.label}</span><span>−${money(discount)}</span></div>` : ""}
          ${voucher ? `<div class="ct-row" style="color:var(--forest)"><span>Rewards voucher (${vou.code}) <a href="#" onclick="removeVoucher();return false;" style="font-size:0.75rem;color:var(--muted)">remove</a></span><span>−${money(voucher)}</span></div>` : ""}
          <div class="ct-row"><span>Shipping</span><span>Calculated at checkout</span></div>
          <div class="ct-row ct-total"><span>Total amount</span><span>${money(total)}</span></div>
          <div class="ct-gst">(Incl GST ${money(gst)}) · + shipping by region &amp; weight</div>
          ${(typeof DM_CUR !== "undefined" && DM_CUR !== "AUD") ? `<div class="ct-gst">≈ charged in AUD: <strong>${moneyAud(total)}</strong></div>` : ""}
        </div>

        <div class="cart-actions">
          <a class="btn btn--outline" href="shop.html">← Continue shopping</a>
          <a class="btn btn--primary" id="continueBtn" href="checkout.html">Continue to checkout →</a>
        </div>
        <div class="cart-actions-sub">
          <button class="btn btn--outline btn--sm" onclick="emailMyBag()">📧 Email my shopping list</button>
          <button class="cart-empty-link" onclick="emptyCart()">🗑 Empty cart</button>
        </div>
        <p class="cart-secure">🔒 Secure checkout with Card · Apple&nbsp;Pay · Google&nbsp;Pay · Afterpay · Zip · Klarna, via Stripe. You can review your order before paying.</p>`;

      aside.innerHTML = confidenceCard(total);
      stickyTotal.textContent = money(total);
    }

    function removeVoucher() {
      if (typeof setVoucher === "function") setVoucher(null);
      renderCartPage();
      showToast("Rewards voucher removed");
    }

    function applyCoupon() {
      const val = (document.getElementById("couponInput").value || "").trim().toUpperCase();
      if (val === "WELCOME20") { window._coupon = "WELCOME20"; localStorage.setItem("dm_coupon", "WELCOME20"); showToast("Member code applied, 20% off 🎉"); }
      else if (!val) { window._coupon = null; localStorage.removeItem("dm_coupon"); }
      else { showToast("Sorry, that code isn't valid"); }
      renderCartPage();
    }

    // Restore an applied coupon, or auto-apply the member's coupon
    (function () {
      const saved = localStorage.getItem("dm_coupon");
      const a = getAccount();
      window._coupon = saved || (a && a.member && a.coupon) || null;
    })();
    renderCartPage();
  </script>
</body>
</html>

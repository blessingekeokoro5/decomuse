<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart, DecoMuse</title>
  <meta name="description" content="Your DecoMuse shopping cart.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cart.html">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>
      <span class="eyebrow">Your selection</span>
      <h1>Shopping cart</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="cartWrap"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    function renderCartPage() {
      const wrap = document.getElementById("cartWrap");
      const cart = getCart();
      if (!cart.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <div class="em">🛍️</div>
            <h2>Your cart is empty</h2>
            <p>Discover curated pieces for every room, or let the Muse Stylist AI style your space.</p>
            <div class="btn-row" style="justify-content:center;margin-top:20px">
              <a class="btn btn--primary" href="shop.html">Shop the collection</a>
              <a class="btn btn--outline" href="stylist.html">✦ Try Muse Stylist AI</a>
            </div>
          </div>`;
        return;
      }
      const sub = cartTotal();
      const disc = orderDiscount(sub);
      const discount = disc.amount;
      const shipping = (sub - discount) >= 500 ? 0 : 19;
      const lines = cart.map(i => `
        <div class="cart-line">
          <div class="thumb"><div class="ph ${i.ph}" data-label="${i.name}"></div></div>
          <div>
            <div style="color:var(--rose-deep);font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase">${i.cat}</div>
            <h3 style="font-size:1.1rem;margin:2px 0 6px">${i.name}${(i.colour || i.size) ? ` <small style="color:var(--muted);font-weight:400">· ${[i.colour, i.size].filter(Boolean).join(" · ")}</small>` : ""}</h3>
            ${i.contents ? `<p style="font-size:0.8rem;color:var(--muted);margin:0 0 8px;max-width:380px">${i.contents}</p>` : ""}
            <div class="qty">
              <button onclick="setQty('${i.key || i.id}', ${i.qty - 1})">−</button>
              <span>${i.qty}</span>
              <button onclick="setQty('${i.key || i.id}', ${i.qty + 1})">+</button>
            </div>
          </div>
          <div style="text-align:right">
            <div class="price">${money(i.price * i.qty)}</div>
            <button class="link-remove" onclick="removeFromCart('${i.key || i.id}')">Remove</button>
          </div>
        </div>`).join("");

      wrap.innerHTML = `
        <div class="split" style="align-items:flex-start;gap:44px">
          <div>${lines}
            <a href="shop.html" class="link-arrow" style="margin-top:22px;display:inline-flex">← Continue shopping</a>
          </div>
          <div class="summary">
            <h3>Order summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>${money(sub)}</span></div>
            ${discount ? `<div class="summary-row" style="color:var(--forest)"><span>${disc.label}</span><span>−${money(discount)}</span></div>` : ""}
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? "Free" : money(shipping)}</span></div>
            ${shipping !== 0 ? `<div style="font-size:0.82rem;color:var(--muted)">Free shipping over $500</div>` : ""}
            <div class="summary-row total"><span>Total</span><span>${money(sub - discount + shipping)}</span></div>

            <div style="display:flex;gap:8px;margin:16px 0 6px">
              <input id="couponInput" placeholder="Promo code (try WELCOME20)" value="${window._coupon || ""}"
                     style="flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-family:var(--font-body)">
              <button class="btn btn--outline btn--sm" onclick="applyCoupon()">Apply</button>
            </div>
            ${window._coupon === "WELCOME20" ? `<div style="font-size:0.82rem;color:var(--forest)">✓ Member code applied</div>` : ""}

            <a class="btn btn--primary btn--block" style="margin-top:16px" href="checkout.html">Checkout →</a>
            <button class="btn btn--outline btn--block" style="margin-top:10px" onclick="emailMyBag()">📧 Email my shopping list</button>
            <p class="form-note" style="text-align:center">🔒 Secure checkout with Stripe · Card · Apple Pay · Google Pay</p>
          </div>
        </div>`;
    }
    function applyCoupon() {
      const val = (document.getElementById("couponInput").value || "").trim().toUpperCase();
      if (val === "WELCOME20") { window._coupon = "WELCOME20"; localStorage.setItem("dm_coupon", "WELCOME20"); showToast("Member code applied, 20% off 🎉"); }
      else if (!val) { window._coupon = null; localStorage.removeItem("dm_coupon"); }
      else { showToast("Sorry, that code isn't valid"); }
      renderCartPage();
    }
    // Restore an applied coupon, or auto-apply the member's coupon
    (function () {
      const saved = localStorage.getItem("dm_coupon");
      const a = getAccount();
      window._coupon = saved || (a && a.member && a.coupon) || null;
    })();
    renderCartPage();
  </script>
</body>
</html>

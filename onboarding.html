<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Client Onboarding — DecoMuse</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .form-sec-title { font-size: 1rem; letter-spacing: 0.02em; margin: 26px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--rose-deep); }
    .form-sec-title:first-of-type { margin-top: 0; }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.9rem; margin-top: 8px; }
    .consent input { margin-top: 3px; }
    @media print { #site-header, #site-footer, .no-print { display: none !important; } body { background: #fff; } .form-card { box-shadow: none; border: 1px solid #ccc; } }
  </style>
</head>
<body data-page="onboarding.html">
  <div id="site-header"></div>

  <section class="page-banner no-print">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / New Client Onboarding</div>
      <span class="eyebrow">Welcome to DecoMuse</span>
      <h1>New client onboarding</h1>
      <p>Tell us about you and your project so we can style your space beautifully. It only takes a few minutes.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:760px">
      <div style="text-align:right;margin-bottom:14px" class="no-print"><button class="btn btn--outline btn--sm" type="button" onclick="window.print()">⬇ Download / Print</button></div>
      <div class="form-card">
        <form data-client-form="Client Onboarding" data-success="Thank you! Your onboarding details have been sent to DecoMuse. We'll be in touch shortly to get started. 💛">
          <div class="form-sec-title">Your details</div>
          <div class="field-row">
            <div class="field"><label>Full name *</label><input required></div>
            <div class="field"><label>Email *</label><input type="email" required></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Phone *</label><input type="tel" required></div>
            <div class="field"><label>Suburb / City</label><input></div>
          </div>
          <div class="field"><label>Project address</label><input placeholder="Where is the space we'll be styling?"></div>

          <div class="form-sec-title">Your project</div>
          <div class="field-row">
            <div class="field"><label>Service you're interested in *</label>
              <select required>
                <option value="">Select a service</option>
                <option>Property Styling &amp; Staging</option>
                <option>Interior Design</option>
                <option>Vacation Rental Styling</option>
                <option>Home Décor Personal Shopper</option>
                <option>Not sure yet</option>
              </select></div>
            <div class="field"><label>Property type</label>
              <select><option>House</option><option>Apartment</option><option>Townhouse</option><option>Airbnb / short-stay</option><option>Commercial</option><option>Other</option></select></div>
          </div>
          <div class="field"><label>Rooms / areas to style</label><input placeholder="e.g. living room, main bedroom, whole home"></div>
          <div class="field"><label>Tell us about your project</label><textarea style="min-height:100px" placeholder="Your goals, style you love, deadlines (e.g. selling / photoshoot / moving in)…"></textarea></div>
          <div class="field-row">
            <div class="field"><label>Budget range</label>
              <select><option>Under $1,000</option><option>$1,000 – $3,000</option><option>$3,000 – $5,000</option><option>$5,000 – $10,000</option><option>$10,000+</option><option>Not sure yet</option></select></div>
            <div class="field"><label>Ideal timeline</label>
              <select><option>As soon as possible</option><option>Within 2 weeks</option><option>This month</option><option>1–3 months</option><option>Just exploring</option></select></div>
          </div>

          <div class="form-sec-title">Style preferences</div>
          <div class="field-row">
            <div class="field"><label>Styles you love</label><input placeholder="e.g. warm minimal, coastal, classic"></div>
            <div class="field"><label>Colours you love</label><input placeholder="e.g. blush, sage, warm neutrals"></div>
          </div>
          <div class="field"><label>Anything to avoid?</label><input placeholder="Colours, materials or styles you'd rather not use"></div>
          <div class="field"><label>How did you hear about us?</label>
            <select><option value="">Select an option</option><option>Google search</option><option>Instagram</option><option>Facebook</option><option>Pinterest</option><option>Friend or referral</option><option>Real estate agent</option><option>Shopped with us before</option><option>Other</option></select></div>

          <label class="consent"><input type="checkbox" required aria-label="Consent to contact & privacy"> I agree to be contacted by DecoMuse about my project and consent to DecoMuse collecting these details, per the <a href="policy.html?doc=privacy" target="_blank">Privacy Policy</a>. *</label>

          <button type="submit" class="btn btn--primary btn--block" style="margin-top:18px">Submit onboarding</button>
          <div class="form-success"></div>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
